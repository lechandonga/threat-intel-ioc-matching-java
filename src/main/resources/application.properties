server.port=${SERVER_PORT:8080}

# ---- 本地情报源 ----
# 多个来源同时描述同一 IOC 时，冲突裁决规则为：
# 判定等级(MALICIOUS>SUSPICIOUS>CLEAN) -> priority 高 -> firstSeen 早 -> sourceId 字典序
threat-intel.suppression-window-seconds=${SUPPRESSION_WINDOW_SECONDS:600}
threat-intel.load-on-startup=${INTEL_LOAD_ON_STARTUP:true}

threat-intel.sources[0].id=vendor-a-json
threat-intel.sources[0].format=json-feed
threat-intel.sources[0].priority=10
threat-intel.sources[0].path=${INTEL_DIR:src/main/resources/intel-sources}/vendor-a.json

threat-intel.sources[1].id=vendor-b-csv
threat-intel.sources[1].format=csv
threat-intel.sources[1].priority=20
threat-intel.sources[1].path=${INTEL_DIR:src/main/resources/intel-sources}/vendor-b.csv

threat-intel.sources[2].id=opensource-stix
threat-intel.sources[2].format=stix-bundle
threat-intel.sources[2].priority=5
threat-intel.sources[2].path=${INTEL_DIR:src/main/resources/intel-sources}/opensource-stix.json
